---
plugin: netbox.netbox.nb_inventory
# The plugin reads NETBOX_API and NETBOX_TOKEN from the environment. Keeping
# them out of this public file prevents lab endpoints and credentials leaking.
validate_certs: true
group_by:
  - device_roles
query_filters:
  - status: active
compose:
  ansible_host: primary_ip4.address | default('') | regex_replace('/.*$', '')
  rack_position_hostname: rack.name ~ '-u%02d' | format(position)
