---
- name: Install the node API
  become: true
  ansible.builtin.copy:
    src: cluster_node_api.py
    dest: /usr/local/sbin/cluster-node-api
    owner: root
    group: root
    mode: "0755"
  notify: Restart cluster-node-api

- name: Install the node API unit
  become: true
  ansible.builtin.template:
    src: cluster-node-api.service.j2
    dest: /etc/systemd/system/cluster-node-api.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart cluster-node-api

- name: Enable and start the node API
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: cluster-node-api
    enabled: true
    state: started
    daemon_reload: true

- name: Apply node API changes before anything reads it
  ansible.builtin.meta: flush_handlers

- name: Wait for the node API on the provisioning address
  when: not ansible_check_mode
  ansible.builtin.uri:
    url: "http://{{ node_api_bind }}:{{ node_api_port }}/healthz"
    status_code: 200
  register: node_api_health
  until: node_api_health.status == 200
  retries: 20
  delay: 1
