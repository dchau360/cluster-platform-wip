---
- name: Require the node addresses warewulf_server read from NetBox
  ansible.builtin.assert:
    that:
      - warewulf_server_node_addresses is defined
      - warewulf_server_node_addresses | length == lab_node_count | int
    fail_msg: operator_access runs after warewulf_server, which reads node addresses from NetBox
    quiet: true

- name: Resolve every node by name on the head node
  become: true
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} {{ operator_access_hosts_marker }}"
    block: |
      {% for name, address in warewulf_server_node_addresses | dictsort %}
      {{ address }} {{ name }} {{ name }}.{{ lab_prov_domain }}
      {% endfor %}

- name: Create each job user's ssh directory
  become: true
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ operator_access_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate each job user's cluster key once
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C "{{ item.name }}@cluster" -f /home/{{ item.name }}/.ssh/id_ed25519
    creates: "/home/{{ item.name }}/.ssh/id_ed25519"
  loop: "{{ operator_access_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each job user's cluster public key
  become: true
  ansible.builtin.slurp:
    src: "/home/{{ item.name }}/.ssh/id_ed25519.pub"
  loop: "{{ operator_access_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: operator_access_pubkeys
  check_mode: false

- name: Authorize each job user's cluster key for that user
  become: true
  ansible.builtin.lineinfile:
    path: "/home/{{ item.item.name }}/.ssh/authorized_keys"
    line: "{{ item.content | b64decode | trim }}"
    create: true
    owner: "{{ item.item.name }}"
    group: "{{ item.item.name }}"
    mode: "0600"
  loop: "{{ operator_access_pubkeys.results }}"
  loop_control:
    label: "{{ item.item.name }}"

- name: Accept node host keys without a prompt
  become: true
  ansible.builtin.blockinfile:
    path: /etc/ssh/ssh_config.d/50-cluster-nodes.conf
    create: true
    mode: "0644"
    marker: "# {mark} {{ operator_access_hosts_marker }}"
    block: |
      # Every node presents the cluster host key from the Warewulf
      # ssh.host_keys overlay, so the first sighting is safe to record and a
      # rebuilt node keeps it. Without this, mpirun and pdsh stop at a prompt.
      Host {{ lab_node_name_prefix }}*
        StrictHostKeyChecking accept-new
