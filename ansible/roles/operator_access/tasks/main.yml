---
- name: Create each job user's ssh directory
  become: true
  ansible.builtin.file:
    path: "/home/{{ item.name }}/.ssh"
    state: directory
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "0700"
  loop: "{{ operator_access_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Generate each job user's cluster key once
  become: true
  become_user: "{{ item.name }}"
  ansible.builtin.command:
    cmd: ssh-keygen -q -t ed25519 -N "" -C "{{ item.name }}@cluster" -f /home/{{ item.name }}/.ssh/id_ed25519
    creates: "/home/{{ item.name }}/.ssh/id_ed25519"
  loop: "{{ operator_access_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read each job user's cluster public key
  become: true
  ansible.builtin.slurp:
    src: "/home/{{ item.name }}/.ssh/id_ed25519.pub"
  loop: "{{ operator_access_users }}"
  loop_control:
    label: "{{ item.name }}"
  register: operator_access_pubkeys
  check_mode: false

- name: Authorize each job user's cluster key for that user
  become: true
  ansible.builtin.lineinfile:
    path: "/home/{{ item.item.name }}/.ssh/authorized_keys"
    line: "{{ item.content | b64decode | trim }}"
    create: true
    owner: "{{ item.item.name }}"
    group: "{{ item.item.name }}"
    mode: "0600"
  loop: "{{ operator_access_pubkeys.results }}"
  loop_control:
    label: "{{ item.item.name }}"
