---
# scontrol reconfigure re-reads slurm.conf and, since 23.11, picks up added
# and removed nodes without a restart. Compute nodes get the new files the
# same way: slurmctld pushes a reconfigure to every registered slurmd, which
# re-fetches. Nothing is copied to a node.
- name: Reconfigure Slurm
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: scontrol reconfigure
  register: slurm_config_reconfigure
  changed_when: true
  failed_when:
    - slurm_config_reconfigure.rc != 0
    - "'Unable to contact slurm controller' not in slurm_config_reconfigure.stderr"
