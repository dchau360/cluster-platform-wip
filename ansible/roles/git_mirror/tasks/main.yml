---
- name: Install git and HTTP server
  become: true
  ansible.builtin.package:
    name: [git, nginx]
    state: present
- name: Create mirror directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: [/srv/git/mirror, /srv/git/published]
- name: Install mirror updater
  become: true
  ansible.builtin.template:
    src: update-mirror.sh.j2
    dest: /usr/local/sbin/update-cluster-mirror
    mode: "0755"
- name: Install mirror units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [cluster-git-mirror.service, cluster-git-mirror.timer]
- name: Enable mirror timer and HTTP publishing
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [cluster-git-mirror.timer, nginx]
