---
- name: Install git and HTTP server
  become: true
  ansible.builtin.package:
    name: [git, nginx]
    state: present
- name: Create mirror directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  loop: [/srv/git/mirror, /srv/git/published]
- name: Install mirror updater
  become: true
  ansible.builtin.template:
    src: update-mirror.sh.j2
    dest: /usr/local/sbin/update-cluster-mirror
    mode: "0755"
- name: Remove the distribution nginx default site
  become: true
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx
- name: Publish the deployed repository on the provisioning address
  become: true
  ansible.builtin.template:
    src: nginx-git.conf.j2
    dest: /etc/nginx/sites-available/cluster-git
    mode: "0644"
  notify: Restart nginx
- name: Enable the deployed repository nginx site
  become: true
  ansible.builtin.file:
    src: /etc/nginx/sites-available/cluster-git
    dest: /etc/nginx/sites-enabled/cluster-git
    state: link
  notify: Restart nginx
- name: Install mirror units
  become: true
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop: [cluster-git-mirror.service, cluster-git-mirror.timer]
- name: Make nginx wait for the provisioning address before it binds
  become: true
  ansible.builtin.file:
    path: /etc/systemd/system/nginx.service.d
    state: directory
    mode: "0755"
- name: Give nginx the ordering that keeps its bind from racing lab-net
  become: true
  ansible.builtin.copy:
    dest: /etc/systemd/system/nginx.service.d/cluster-lab-after-net.conf
    mode: "0644"
    content: |
      # nginx serves the node git mirror on the provisioning address
      # (10.42.0.1:80), which lab-net.service assigns at boot. Started
      # without this ordering it races lab-net, the bind fails with
      # "Cannot assign requested address", and after a cold start every
      # node's ansible-pull fails with "Connection refused to 10.42.0.1:80"
      # so slurmd never starts. The cold-start drill caught exactly that.
      [Unit]
      After=lab-net.service
      Wants=lab-net.service
  notify: Restart nginx
- name: Enable mirror timer and HTTP publishing
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: [cluster-git-mirror.timer, nginx]
