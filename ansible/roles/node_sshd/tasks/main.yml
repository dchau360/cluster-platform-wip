---
# Operator login from the head node: `sudo ssh cnNN`. Key only, never a
# password; root by key only. Job users log in with the key in their shared
# /home; fencing that to nodes running their jobs is pam_slurm_adopt, see
# docs/operations.md.
# OpenSSH 9.8 and later penalise a source address after one slow or failed
# login by refusing every new connection from it for a while, and the penalty
# grows with each retry. Every connection to a node comes from the head node,
# so one bad login would lock every operator and every MPI launch out of that
# node. Exempt the head node. Older sshd rejects the keyword outright, which
# would leave the node with no sshd, so it is written only when supported.
- name: Read sshd's defaults
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: node_sshd_defaults
  changed_when: false
  failed_when: false
  check_mode: false

- name: Note whether this sshd penalises sources
  ansible.builtin.set_fact:
    node_sshd_penalties: "{{ 'persourcepenalties' in (node_sshd_defaults.stdout | default('')) }}"

- name: Allow key authentication only
  ansible.builtin.copy:
    dest: "{{ node_sshd_dropin }}"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Written by the node_sshd role (ansible-pull). Do not edit by hand.
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      PubkeyAuthentication yes
      {% if node_sshd_penalties and node_sshd_penalty_exempt | length > 0 %}
      PerSourcePenaltyExemptList {{ node_sshd_penalty_exempt | join(',') }}
      {% endif %}
  notify: Restart sshd

- name: Enable and start sshd
  ansible.builtin.systemd:
    name: "{{ node_sshd_service }}"
    enabled: true
    state: started

- name: Apply a configuration change before checking it
  ansible.builtin.meta: flush_handlers

# The effective configuration, not the file: proves the drop-in is included
# and that nothing read earlier overrides it.
- name: Read sshd's effective configuration
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: /usr/sbin/sshd -T
  register: node_sshd_effective
  changed_when: false

- name: Refuse an sshd that would accept a password
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in node_sshd_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in node_sshd_effective.stdout_lines"
      - "'permitrootlogin without-password' in node_sshd_effective.stdout_lines"
    fail_msg: sshd's effective configuration still allows password login
    quiet: true

- name: Wait for sshd to listen
  when: not ansible_check_mode
  ansible.builtin.wait_for:
    port: "{{ node_sshd_port | int }}"
    timeout: 30
