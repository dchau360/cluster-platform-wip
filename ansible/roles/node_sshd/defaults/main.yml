---
# sshd and its host keys ship in the image and the overlays; the image ships
# the unit disabled, like every service. Enabling it, key-only, is this role's
# job. The root key it accepts is the head node's, delivered by the warewulf
# `ssh.authorized_keys` runtime overlay; the host keys come from the
# `ssh.host_keys` system overlay.
node_sshd_service: sshd
node_sshd_port: 22
# 00- so it sorts ahead of the distribution's 50-redhat.conf: sshd keeps the
# first value it reads for a keyword, so the earliest drop-in wins.
node_sshd_dropin: /etc/ssh/sshd_config.d/00-cluster-lab.conf
# Addresses sshd never penalises for a failed or slow login: the head node,
# which every connection to a node comes through. See tasks/main.yml.
node_sshd_penalty_exempt:
  - "{{ node_facts.controller.address }}"
