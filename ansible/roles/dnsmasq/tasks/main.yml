---
- name: Install dnsmasq
  become: true
  ansible.builtin.package: {name: dnsmasq, state: present}
- name: Install NetBox dnsmasq renderer
  become: true
  ansible.builtin.copy:
    src: render_dnsmasq.py
    dest: /usr/local/sbin/render-netbox-dnsmasq
    mode: "0755"
- name: Install the InfiniBand GUID helper next to the renderer
  become: true
  ansible.builtin.copy:
    # Kept in netbox/ rather than duplicated into this role's files/, so the
    # unit tests and the deployed renderer run the same module.
    src: "{{ playbook_dir }}/../netbox/ib_guid.py"
    dest: /usr/local/sbin/ib_guid.py
    mode: "0644"
- name: Create dnsmasq and TFTP state directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ lab_state_dir }}/dnsmasq"
    - "{{ lab_state_dir }}/tftp"
- name: Render dnsmasq reservations from NetBox
  become: true
  ansible.builtin.command:
    cmd: /opt/cluster-netbox/venv/bin/python /usr/local/sbin/render-netbox-dnsmasq
  environment:
    NETBOX_TOKEN: "{{ netbox_runtime_token }}"
    NETBOX_URL: http://127.0.0.1:8000
    PROV_DOMAIN: "{{ lab_prov_domain }}"
    DNSMASQ_NETBOX_HOSTS_OUTPUT: "{{ lab_state_dir }}/dnsmasq/netbox-hosts"
  register: dnsmasq_render
  changed_when: dnsmasq_render.stdout | trim == 'changed'
  notify: Restart dnsmasq
# The head node resolves node names from the same NetBox render, so
# `sudo ssh cn01` works without DNS. WSL rewrites /etc/hosts at every start;
# scripts/net-up.sh runs the same command at boot to put the block back.
- name: Resolve node names on the head node, from NetBox
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: python3 /usr/local/sbin/render-netbox-dnsmasq --etc-hosts
  environment:
    DNSMASQ_NETBOX_HOSTS_OUTPUT: "{{ lab_state_dir }}/dnsmasq/netbox-hosts"
  register: dnsmasq_etc_hosts
  changed_when: dnsmasq_etc_hosts.stdout | trim == 'changed'
- name: Point provisioning dnsmasq at NetBox reservations
  become: true
  ansible.builtin.lineinfile:
    path: "{{ lab_state_dir }}/dnsmasq/lab.conf"
    regexp: ^dhcp-hostsfile=
    line: "dhcp-hostsfile={{ lab_state_dir }}/dnsmasq/netbox-hosts.conf"
  notify: Restart dnsmasq
- name: Keep the distribution dnsmasq disabled to prevent port conflicts
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: dnsmasq
    enabled: false
    masked: true
    state: stopped
- name: Enable provisioning-only dnsmasq
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: lab-dnsmasq
    enabled: true
    state: started
