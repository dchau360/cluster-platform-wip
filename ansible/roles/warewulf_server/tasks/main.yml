---
- name: Install Warewulf runtime and source-build dependencies
  become: true
  ansible.builtin.apt:
    name: "{{ warewulf_server_packages }}"
    state: present
    update_cache: true

- name: Create the Warewulf source cache
  become: true
  ansible.builtin.file:
    path: "{{ warewulf_server_source_root }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned Warewulf source release
  become: true
  ansible.builtin.get_url:
    url: "{{ warewulf_server_source_url }}"
    dest: "{{ warewulf_server_source_archive }}"
    checksum: "sha256:{{ warewulf_server_source_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Extract the pinned Warewulf source release
  become: true
  ansible.builtin.unarchive:
    src: "{{ warewulf_server_source_archive }}"
    dest: "{{ warewulf_server_source_root }}"
    remote_src: true
    creates: "{{ warewulf_server_source_dir }}/Makefile"

- name: Build and install Warewulf from the pinned release
  become: true
  ansible.builtin.command:
    cmd: make install
    chdir: "{{ warewulf_server_source_dir }}"
    creates: "{{ warewulf_server_binary }}"
  environment:
    OFFLINE_BUILD: "1"
  notify: Reload systemd

- name: Flush systemd reload before service management
  ansible.builtin.meta: flush_handlers

# ---------------------------------------------------------------------------
# Server configuration.
#
# `wwctl` reads /usr/local/etc/warewulf/warewulf.conf because the server is
# built from source with the default prefix. The packaged path is not used
# here, and writing there would be a silent no-op.
# ---------------------------------------------------------------------------

- name: Create the Warewulf configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ warewulf_server_conf_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render the Warewulf server configuration
  become: true
  ansible.builtin.template:
    src: warewulf.conf.j2
    dest: "{{ warewulf_server_conf_file }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart Warewulf

- name: Apply configuration changes before touching services
  ansible.builtin.meta: flush_handlers

- name: Populate the TFTP tree with the iPXE boot programmes
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: wwctl configure tftp
  # The command rewrites the same files every time; the change that matters
  # is the rendered configuration above, which notifies the restart.
  changed_when: false

- name: Enable and start Warewulf
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: warewulfd
    enabled: true
    state: started

# warewulf ships the `ssh.host_keys` overlay but does not generate the keys it
# renders: its `{{Include "keys/ssh_host_*"}}` templates read
# /usr/local/etc/warewulf/keys/ on the server, and a key that is not there
# renders to an empty file in every node. `wwctl configure ssh` creates one key
# per configured type and is idempotent (it skips keys that already exist).
- name: Generate the cluster SSH host keys
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: wwctl configure ssh
  changed_when: false
  notify: Rebuild overlays

# Every node boots those same host keys, so any host can trust them before the
# first login: one known_hosts line per key type, naming every node name and
# address in the NetBox render the dnsmasq role wrote. The head node gets the
# lines here; the nodes get the same lines from the identity overlay below, so
# `sudo ssh cn01` and `ssh cn02` from a node both ask nothing. Nodes outside
# that list still get the usual prompt.
- name: Find the cluster SSH host public keys
  become: true
  ansible.builtin.find:
    paths: "{{ warewulf_server_conf_dir }}/keys"
    patterns: ssh_host_*_key.pub
  register: warewulf_server_host_pubkey_files

- name: Read the cluster SSH host public keys
  become: true
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ warewulf_server_host_pubkey_files.files | sort(attribute='path') }}"
  loop_control: {label: "{{ item.path | basename }}"}
  register: warewulf_server_host_pubkeys

- name: Read the node names NetBox renders
  become: true
  ansible.builtin.slurp:
    src: "{{ lab_state_dir }}/dnsmasq/netbox-hosts"
  register: warewulf_server_node_hosts
  failed_when: false

- name: Render the known_hosts lines for every node name
  vars:
    warewulf_server_node_names: >-
      {{ (warewulf_server_node_hosts.content | default('') | b64decode).split()
         | unique | list }}
  when:
    - warewulf_server_node_names | length > 0
    - warewulf_server_host_pubkeys.results | default([]) | length > 0
  ansible.builtin.set_fact:
    warewulf_server_known_hosts: |-
      {%- for key in warewulf_server_host_pubkeys.results -%}
      {{ warewulf_server_node_names | join(',') }} {{ (key.content | b64decode).split()[:2] | join(' ') }}
      {% endfor -%}

- name: Trust the cluster host keys for every node name
  become: true
  when: warewulf_server_known_hosts is defined
  ansible.builtin.blockinfile:
    path: /etc/ssh/ssh_known_hosts
    create: true
    owner: root
    group: root
    mode: "0644"
    marker: "# {mark} cluster-lab node host keys, from warewulf. Do not edit by hand."
    block: "{{ warewulf_server_known_hosts }}"

# ---------------------------------------------------------------------------
# Node image, imported from a public registry.
# ---------------------------------------------------------------------------

- name: Read the imported-image marker
  become: true
  ansible.builtin.slurp:
    src: "{{ warewulf_server_image_state_file }}"
  register: warewulf_server_image_state
  failed_when: false

- name: Import the node image when its tag has changed
  become: true
  when:
    - not ansible_check_mode
    - (warewulf_server_image_state.content is not defined)
      or ((warewulf_server_image_state.content | b64decode | trim)
          != warewulf_server_image_tag)
  ansible.builtin.command:
    cmd: >-
      wwctl image import --build --force
      {{ warewulf_server_image_uri }} {{ warewulf_server_image_name }}
  register: warewulf_server_image_import
  changed_when: warewulf_server_image_import.rc == 0

- name: Record which image tag is imported
  become: true
  when: not ansible_check_mode
  ansible.builtin.copy:
    content: "{{ warewulf_server_image_tag }}\n"
    dest: "{{ warewulf_server_image_state_file }}"
    owner: root
    group: root
    mode: "0644"

# ---------------------------------------------------------------------------
# Discovery image and profile (SRE-12).
#
# A node with no identity yet boots this image once to describe itself. See
# scripts/discover.sh for the harness and docs/discovery.md for the design.
# The image itself holds no credential; the NetBox endpoint and token arrive
# at boot from the cluster-discovery runtime overlay built below.
# ---------------------------------------------------------------------------

- name: Read the imported discovery-image marker
  become: true
  ansible.builtin.slurp:
    src: "{{ warewulf_server_discovery_image_state_file }}"
  register: warewulf_server_discovery_image_state
  failed_when: false

- name: Import the discovery image when its tag has changed
  become: true
  when:
    - not ansible_check_mode
    - (warewulf_server_discovery_image_state.content is not defined)
      or ((warewulf_server_discovery_image_state.content | b64decode | trim)
          != warewulf_server_discovery_image_tag)
  ansible.builtin.command:
    cmd: >-
      wwctl image import --build --force
      {{ warewulf_server_discovery_image_uri }}
      {{ warewulf_server_discovery_image_name }}
  changed_when: true

- name: Record which discovery image tag is imported
  become: true
  when: not ansible_check_mode
  ansible.builtin.copy:
    content: "{{ warewulf_server_discovery_image_tag }}\n"
    dest: "{{ warewulf_server_discovery_image_state_file }}"
    owner: root
    group: root
    mode: "0644"

# --- discovery runtime overlay: where NetBox is, and how to write to it -----

- name: Read the NetBox runtime environment
  become: true
  ansible.builtin.slurp:
    src: "{{ warewulf_server_netbox_env_file }}"
  register: warewulf_server_netbox_env_file_contents
  failed_when: false
  no_log: true

- name: Derive the NetBox API token for the discovery overlay
  when: warewulf_server_netbox_env_file_contents.content is defined
  ansible.builtin.set_fact:
    warewulf_server_netbox_token: >-
      nbt_{{ (warewulf_server_netbox_env_file_contents.content | b64decode
              | regex_search('(?m)^SUPERUSER_API_KEY=(.+)$', '\1')).0
      }}.{{ (warewulf_server_netbox_env_file_contents.content | b64decode
             | regex_search('(?m)^SUPERUSER_API_TOKEN=(.+)$', '\1')).0 }}
  no_log: true

- name: Require a NetBox token before building the discovery overlay
  when: warewulf_server_netbox_token is not defined
  ansible.builtin.fail:
    msg: >-
      {{ warewulf_server_netbox_env_file }} is missing or has no
      SUPERUSER_API_KEY/SUPERUSER_API_TOKEN, so the discovery overlay cannot
      carry an API token. Bring NetBox up first (`make up`) and re-run.

- name: Create the discovery overlay tree
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_discovery_overlay
         }}/rootfs/{{ warewulf_server_discovery_env_dir | regex_replace('^/', '') }}
    state: directory
    owner: root
    group: root
    mode: "0700"
  notify: Rebuild overlays

- name: Deliver the NetBox endpoint and token through the discovery overlay
  become: true
  ansible.builtin.copy:
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_discovery_overlay
         }}/rootfs/{{ warewulf_server_discovery_env_dir | regex_replace('^/', '')
         }}/netbox.env
    content: |
      # Delivered at boot by the cluster-discovery Warewulf runtime overlay.
      # Not in git, not in an image. Rotating it is a lab-host edit and a
      # reboot. See docs/discovery.md.
      NETBOX_URL={{ lab_netbox_segment_url }}
      NETBOX_TOKEN={{ warewulf_server_netbox_token }}
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Rebuild overlays

# ---------------------------------------------------------------------------
# Cluster identity, delivered at boot and never stored in git or an image.
# ---------------------------------------------------------------------------

- name: Create the secret directory
  become: true
  ansible.builtin.file:
    path: "{{ warewulf_server_secret_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Generate the cluster Munge key once
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: dd if=/dev/urandom of={{ warewulf_server_munge_key }} bs=1 count=1024
    creates: "{{ warewulf_server_munge_key }}"

- name: Restrict the Munge key
  become: true
  ansible.builtin.file:
    path: "{{ warewulf_server_munge_key }}"
    owner: root
    group: root
    mode: "0400"

- name: Create the identity overlay tree
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/cluster-lab
    state: directory
    owner: root
    group: root
    mode: "0755"

# The node reports the image it was provisioned from.
#
# The tag is the platform's, not the image's: it is the value this role
# imported and the marker it wrote. Delivering it through the same runtime
# overlay that carries the node's identity means a rollback changes the tag
# the booted node reports, so 'roll back, reboot, read the version back' is a
# complete drill rather than one that needs a human to remember what was
# imported.
- name: Create the provisioning-record directory in the identity overlay
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/cluster-lab
    state: directory
    owner: root
    group: root
    mode: "0755"
  notify: Rebuild overlays

# A template, rendered per node from the `image_reference` tag. The profile
# carries the default (set below); a rolling image update overrides it on one
# node at a time, so each node reports the image it actually booted.
- name: Remove the static image reference
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/cluster-lab/image-reference
    state: absent
  notify: Rebuild overlays

- name: Record the image reference the node was provisioned from
  become: true
  ansible.builtin.copy:
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/cluster-lab/image-reference.ww
    content: |
      {{ '{{' }} index .Tags "image_reference" {{ '}}' }}
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild overlays

# Delivered beside the image reference, not at /etc/munge/munge.key. munged
# refuses a key it does not own, and wwclient re-lays overlay files with the
# overlay's ownership on every refresh; the node's munge role copies the key
# into place with the node's own munge user. See ansible/roles/munge.
- name: Remove the Munge key from its pre-SRE-7 overlay path
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/munge
    state: absent
  notify: Rebuild overlays

- name: Deliver the Munge key through the overlay
  become: true
  ansible.builtin.copy:
    src: "{{ warewulf_server_munge_key }}"
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/cluster-lab/munge.key
    remote_src: true
    owner: root
    group: root
    mode: "0400"
  notify: Rebuild overlays

# The same known_hosts lines, for node-to-node SSH (a job's `ssh cn02` from
# cn01). The nodes boot the same host keys the head node trusts, so the file is
# valid on every node unchanged. A whole file rather than a marked block: the
# image ships no /etc/ssh/ssh_known_hosts, and the overlay replaces it on every
# refresh. A node role cannot write it, since it would need every other node's
# name, and check-node-roles keeps node roles to the node itself.
- name: Create the ssh directory in the identity overlay
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/ssh
    state: directory
    owner: root
    group: root
    mode: "0755"
  notify: Rebuild overlays

- name: Deliver the cluster host keys' known_hosts through the overlay
  become: true
  when: warewulf_server_known_hosts is defined
  ansible.builtin.copy:
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/ssh/ssh_known_hosts
    content: |
      # cluster-lab node host keys, from warewulf. Do not edit by hand.
      {{ warewulf_server_known_hosts }}
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild overlays

# ---------------------------------------------------------------------------
# Identity proof on every boot.
#
# The identity criterion is not "the overlay was built", it is "the booted
# node has the files". A oneshot in the same runtime overlay checks that from
# inside the node, after the overlay is applied, and writes to the console as
# well as the journal. The boot transcript then carries the proof instead of a
# human having to log in later.
# ---------------------------------------------------------------------------

- name: Create the identity-check directories in the identity overlay
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/{{ item }}
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - usr/local/sbin
    - etc/systemd/system/multi-user.target.wants
  notify: Rebuild overlays

- name: Install the in-node identity check
  become: true
  ansible.builtin.copy:
    src: cluster-identity-check.sh
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/usr/local/sbin/cluster-identity-check
    owner: root
    group: root
    mode: "0755"
  notify: Rebuild overlays

- name: Install the identity-check unit
  become: true
  ansible.builtin.copy:
    src: cluster-identity-check.service
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/systemd/system/cluster-identity-check.service
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild overlays

- name: Enable the identity check
  become: true
  ansible.builtin.file:
    src: ../cluster-identity-check.service
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_identity_overlay
         }}/rootfs/etc/systemd/system/multi-user.target.wants/cluster-identity-check.service
    state: link
    force: true
  notify: Rebuild overlays

# ---------------------------------------------------------------------------
# Node wwclient configuration.
#
# See the note on warewulf_server_wwclient_overlay in defaults/main.yml. The
# wwclient.service unit is installed by warewulf's built-in `wwclient` overlay;
# this overlay only supplies the environment file that unit already reads.
# ---------------------------------------------------------------------------

- name: Create the node wwclient overlay tree
  become: true
  ansible.builtin.file:
    path: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_wwclient_overlay
         }}/rootfs/etc/default
    state: directory
    owner: root
    group: root
    mode: "0755"
  notify: Rebuild overlays

- name: Point the node wwclient at the rendered node configuration
  become: true
  ansible.builtin.copy:
    dest: >-
      {{ warewulf_server_overlay_dir }}/{{ warewulf_server_wwclient_overlay
         }}/rootfs/etc/default/wwclient
    content: |
      # Read by warewulf's wwclient.service (`EnvironmentFile=-/etc/default/wwclient`).
      # The node binary is built from source with the default /usr/local prefix,
      # so its compiled-in path is /usr/local/etc/warewulf/warewulf.conf. The
      # wwinit overlay renders the node configuration at
      # /etc/warewulf/warewulf.conf and the image has no /usr/local copy, so
      # without this the unit exits at startup and the runtime overlay is never
      # refreshed.
      WAREWULFCONF=/etc/warewulf/warewulf.conf
    owner: root
    group: root
    mode: "0644"
  notify: Rebuild overlays

- name: Build the cluster-pull overlay
  ansible.builtin.import_tasks: pull_overlay.yml

# ---------------------------------------------------------------------------
# Node and profile definitions, derived from the node count.
#
# No node list exists in this repository. `lab_node_count` is the same
# variable `make demo N=<n>` sets, and N=2 and N=4 differ only in this loop.
# ---------------------------------------------------------------------------

- name: Read the Warewulf node database
  become: true
  ansible.builtin.slurp:
    src: "{{ warewulf_server_conf_dir }}/nodes.conf"
  register: warewulf_server_nodes_file
  failed_when: false

- name: Parse the existing node names
  ansible.builtin.set_fact:
    warewulf_server_existing_nodes: >-
      {{ ((warewulf_server_nodes_file.content | b64decode | from_yaml).nodes
          | default({}, true))
         if (warewulf_server_nodes_file.content is defined) else {} }}

- name: Point the default profile at the image and the runtime overlays
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      wwctl profile set -y default
      --image {{ warewulf_server_image_name }}
      --kernelargs {{ warewulf_server_kernel_args }}
      --runtime-overlays {{ warewulf_server_runtime_overlays | join(',') }}
      --tagadd IPXEMenuEntry={{ warewulf_server_ipxe_method }}
      --tagadd image_reference={{ warewulf_server_image_uri }}
  changed_when: false

# NetBox is the source of truth for a node's address: the DNS name on its
# provisioning address is its hostname, so the address is looked up by name.
# There is deliberately no second address formula here: Warewulf, dnsmasq and
# the node API must all consume the exact address seeded into NetBox.
- name: Read node addresses from NetBox
  when: netbox_runtime_token is defined
  ansible.builtin.uri:
    url: >-
      http://127.0.0.1:8000/api/ipam/ip-addresses/?dns_name={{ lab_node_name_prefix
      }}{{ '%02d' | format(item) }}.{{ lab_prov_domain }}
    headers:
      Authorization: "Token {{ netbox_runtime_token }}"
  loop: "{{ range(1, (lab_node_count | int) + 1) | list }}"
  loop_control:
    label: "{{ lab_node_name_prefix }}{{ '%02d' | format(item) }}"
  register: warewulf_server_netbox_addresses
  check_mode: false
  no_log: true

- name: Settle each node's address
  ansible.builtin.set_fact:
    warewulf_server_node_addresses: >-
      {{ warewulf_server_node_addresses | default({})
         | combine({(lab_node_name_prefix ~ ('%02d' | format(item.item))):
                    ((item.json.results | default([]) | map(attribute='address') | first | default(''))
                      | regex_replace('/.*$', ''))}) }}
  loop: "{{ warewulf_server_netbox_addresses.results | default([]) }}"
  loop_control:
    label: "{{ lab_node_name_prefix }}{{ '%02d' | format(item.item) }}"

- name: Assert NetBox supplied every Warewulf node address
  ansible.builtin.assert:
    that:
      - warewulf_server_node_addresses | default({}) | length == lab_node_count | int
      - warewulf_server_node_addresses.values() | reject('equalto', '') | list | length == lab_node_count | int
    fail_msg: NetBox did not return one provisioning address for every requested node

- name: Define every node from the node count
  become: true
  when:
    - not ansible_check_mode
    - (lab_node_name_prefix ~ ('%02d' | format(item)))
      not in (warewulf_server_existing_nodes | default({}))
  ansible.builtin.command:
    cmd: >-
      wwctl node add {{ lab_node_name_prefix }}{{ '%02d' | format(item) }}
      --ipaddr {{ warewulf_server_node_addresses[lab_node_name_prefix ~ ('%02d' | format(item))] }}
      --netdev {{ warewulf_server_node_netdev }}
      --hwaddr {{ warewulf_server_mac_oui }}:00:{{ '%02x' | format(item // 256) }}:{{ '%02x' | format(item % 256) }}
  loop: "{{ range(1, (lab_node_count | int) + 1) | list }}"
  loop_control:
    label: "{{ lab_node_name_prefix }}{{ '%02d' | format(item) }}"
  register: warewulf_server_node_add
  changed_when: warewulf_server_node_add.rc == 0

- name: Reconcile an existing node's address with NetBox
  become: true
  vars:
    warewulf_server_node: "{{ lab_node_name_prefix }}{{ '%02d' | format(item) }}"
    warewulf_server_current: >-
      {{ ((warewulf_server_existing_nodes | default({}))[warewulf_server_node]
          | default({})).get('network devices', {}).get(warewulf_server_node_netname, {}).get('ipaddr', '') }}
  when:
    - not ansible_check_mode
    - warewulf_server_node in (warewulf_server_existing_nodes | default({}))
    - warewulf_server_node in (warewulf_server_node_addresses | default({}))
    - warewulf_server_current != warewulf_server_node_addresses[warewulf_server_node]
  ansible.builtin.command:
    cmd: >-
      wwctl node set --yes {{ warewulf_server_node }}
      --netname {{ warewulf_server_node_netname }}
      --ipaddr {{ warewulf_server_node_addresses[warewulf_server_node] }}
  loop: "{{ range(1, (lab_node_count | int) + 1) | list }}"
  loop_control:
    label: "{{ lab_node_name_prefix }}{{ '%02d' | format(item) }}"
  changed_when: true
  notify: Rebuild overlays
