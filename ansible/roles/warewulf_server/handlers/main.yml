---
- name: Reload systemd
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart Warewulf
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: warewulfd
    state: restarted

- name: Rebuild overlays
  become: true
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: wwctl overlay build
  changed_when: false
