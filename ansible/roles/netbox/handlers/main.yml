---
- name: Restart NetBox
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: cluster-netbox
    state: restarted

- name: Restart NetBox API proxy
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: lab-netbox-api.socket
    state: restarted
    daemon_reload: true
