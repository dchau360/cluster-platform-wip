---
- name: Install container runtime
  become: true
  ansible.builtin.package:
    name: [docker.io, docker-compose-v2, openssl, python3-venv]
    state: present
- name: Create the local NetBox secret directory
  become: true
  ansible.builtin.file:
    path: /etc/cluster-lab
    state: directory
    owner: root
    group: root
    mode: "0700"
- name: Check for the local NetBox environment
  become: true
  ansible.builtin.stat:
    path: /etc/cluster-lab/netbox.env
  register: netbox_environment
- name: Generate the NetBox database password
  become: true
  when: not netbox_environment.stat.exists
  ansible.builtin.command: openssl rand -hex 32
  register: netbox_database_password
  changed_when: true
  no_log: true
- name: Generate the NetBox secret key
  become: true
  when: not netbox_environment.stat.exists
  ansible.builtin.command: openssl rand -hex 64
  register: netbox_secret_key
  changed_when: true
  no_log: true
- name: Generate the NetBox API token
  become: true
  when: not netbox_environment.stat.exists
  ansible.builtin.command: openssl rand -hex 20
  register: netbox_api_token
  changed_when: true
  no_log: true
- name: Create the local NetBox environment once
  become: true
  when: not netbox_environment.stat.exists
  ansible.builtin.copy:
    dest: /etc/cluster-lab/netbox.env
    owner: root
    group: root
    mode: "0600"
    content: |
      DB_HOST=postgres
      DB_NAME=netbox
      DB_PASSWORD={{ netbox_database_password.stdout }}
      DB_USER=netbox
      POSTGRES_DB=netbox
      POSTGRES_PASSWORD={{ netbox_database_password.stdout }}
      POSTGRES_USER=netbox
      REDIS_CACHE_HOST=redis
      REDIS_HOST=redis
      SECRET_KEY={{ netbox_secret_key.stdout }}
      SUPERUSER_API_TOKEN={{ netbox_api_token.stdout }}
      SUPERUSER_EMAIL=admin@localhost
      SUPERUSER_NAME=admin
  no_log: true
- name: Create NetBox deployment directory
  become: true
  ansible.builtin.file:
    path: /opt/cluster-netbox
    state: directory
    mode: "0750"
- name: Install NetBox Compose definition
  become: true
  ansible.builtin.template:
    src: compose.yml.j2
    dest: /opt/cluster-netbox/compose.yml
    mode: "0640"
  notify: Restart NetBox
- name: Install NetBox systemd service
  become: true
  ansible.builtin.template:
    src: cluster-netbox.service.j2
    dest: /etc/systemd/system/cluster-netbox.service
    mode: "0644"
- name: Enable NetBox service
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: cluster-netbox
    enabled: true
    state: started
    daemon_reload: true
- name: Check for a local NetBox superuser password
  become: true
  ansible.builtin.command:
    cmd: grep -q '^SUPERUSER_PASSWORD=' /etc/cluster-lab/netbox.env
  register: netbox_superuser_password_line
  changed_when: false
  failed_when: false
  no_log: true
- name: Generate a local NetBox superuser password
  become: true
  when: netbox_superuser_password_line.rc != 0
  ansible.builtin.command: openssl rand -hex 32
  register: netbox_superuser_password
  changed_when: true
  no_log: true
- name: Add the local NetBox superuser password once
  become: true
  when: netbox_superuser_password_line.rc != 0
  ansible.builtin.lineinfile:
    path: /etc/cluster-lab/netbox.env
    line: "SUPERUSER_PASSWORD={{ netbox_superuser_password.stdout }}"
    mode: "0600"
  notify: Restart NetBox
  no_log: true
- name: Check for a local NetBox API token pepper
  become: true
  ansible.builtin.command:
    cmd: grep -q '^API_TOKEN_PEPPER_1=' /etc/cluster-lab/netbox.env
  register: netbox_api_token_pepper_line
  changed_when: false
  failed_when: false
  no_log: true
- name: Generate a local NetBox API token pepper
  become: true
  when: netbox_api_token_pepper_line.rc != 0
  ansible.builtin.command: openssl rand -hex 32
  register: netbox_api_token_pepper
  changed_when: true
  no_log: true
- name: Add the local NetBox API token pepper once
  become: true
  when: netbox_api_token_pepper_line.rc != 0
  ansible.builtin.lineinfile:
    path: /etc/cluster-lab/netbox.env
    line: "API_TOKEN_PEPPER_1={{ netbox_api_token_pepper.stdout }}"
    mode: "0600"
  notify: Restart NetBox
  no_log: true
- name: Apply NetBox environment changes before API use
  ansible.builtin.meta: flush_handlers
- name: Read the local NetBox environment
  become: true
  ansible.builtin.slurp:
    src: /etc/cluster-lab/netbox.env
  register: netbox_environment_file
  no_log: true
- name: Retain the runtime NetBox token for managed generators
  ansible.builtin.set_fact:
    netbox_runtime_token: >-
      {{ (netbox_environment_file.content | b64decode
          | regex_search('(?m)^SUPERUSER_API_TOKEN=(.+)$', '\1')).0 }}
  no_log: true
- name: Wait for the authenticated NetBox API
  ansible.builtin.uri:
    url: http://127.0.0.1:8000/api/
    headers:
      Authorization: "Token {{ netbox_runtime_token }}"
    status_code: 200
  register: netbox_api_health
  until: netbox_api_health.status == 200
  retries: 60
  delay: 5
  no_log: true
- name: Install the repository NetBox definition and seeder
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../netbox/"
    dest: /opt/cluster-netbox/seed/
    owner: root
    group: root
    mode: preserve
- name: Create the NetBox seeder virtual environment
  become: true
  ansible.builtin.command:
    cmd: python3 -m venv /opt/cluster-netbox/venv
    creates: /opt/cluster-netbox/venv/bin/python
- name: Install NetBox seeder dependencies
  become: true
  ansible.builtin.pip:
    requirements: /opt/cluster-netbox/seed/requirements.txt
    virtualenv: /opt/cluster-netbox/venv
- name: Seed NetBox from the repository definition
  become: true
  ansible.builtin.command:
    cmd: /opt/cluster-netbox/venv/bin/python /opt/cluster-netbox/seed/seed.py
  environment:
    NETBOX_TOKEN: "{{ netbox_runtime_token }}"
    NETBOX_URL: http://127.0.0.1:8000
    NODE_COUNT: "{{ lab_node_count }}"
  register: netbox_seed_result
  changed_when: "'changed=0' not in netbox_seed_result.stdout"
  no_log: true
