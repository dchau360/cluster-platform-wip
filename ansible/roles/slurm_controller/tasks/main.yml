---
- name: Install the Slurm controller and Munge
  become: true
  ansible.builtin.apt:
    name: "{{ slurm_controller_packages }}"
    state: present

- name: Install the cluster Munge key on the controller
  become: true
  ansible.builtin.copy:
    src: "{{ slurm_controller_munge_key_source }}"
    dest: /etc/munge/munge.key
    remote_src: true
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  notify:
    - Restart munge on the controller
    - Restart slurmctld

- name: Enable and start munge
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: munge
    enabled: true
    state: started

# A notified restart is lost if the run that changed the key fails before
# handlers run; the next run then sees the key unchanged and munged keeps
# the old key in memory, rejecting every node. Judge the daemon instead of
# the handler: a munged that started before its key was written is stale.
- name: Read when the controller's Munge key was written
  become: true
  ansible.builtin.stat:
    path: /etc/munge/munge.key
    get_checksum: false
  register: slurm_controller_munge_key

# Wall clock, not ActiveEnterTimestampMonotonic: under WSL the monotonic
# clock and /proc/uptime drift apart by hours.
- name: Read when munged started
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: [systemctl, show, munge, --property=ActiveEnterTimestamp, --value, --timestamp=unix]
  register: slurm_controller_munged_started
  changed_when: false

- name: Restart a munged that still holds an older key
  become: true
  when:
    - not ansible_check_mode
    - (slurm_controller_munged_started.stdout | trim | regex_replace('^@', '') | int)
      < (slurm_controller_munge_key.stat.mtime | int)
  ansible.builtin.systemd_service:
    name: munge
    state: restarted
  notify: Restart slurmctld

- name: Read the Slurm service account
  ansible.builtin.getent:
    database: passwd
    key: "{{ cluster_slurm_user.name }}"

- name: Refuse a Slurm account whose UID the nodes would not share
  ansible.builtin.assert:
    that:
      - ansible_facts.getent_passwd[cluster_slurm_user.name][1] | int == cluster_slurm_user.uid | int
    fail_msg: >-
      {{ cluster_slurm_user.name }} has UID {{ ansible_facts.getent_passwd[cluster_slurm_user.name][1] }}
      on the controller; cluster_slurm_user.uid is {{ cluster_slurm_user.uid }}.

- name: Create the job user groups
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.uid }}"
  loop: "{{ cluster_job_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the job users, with the UIDs the nodes use
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
  loop: "{{ cluster_job_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the controller state and log directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  loop:
    - "{{ slurm_config_state_dir | default('/var/lib/slurm/slurmctld') }}"
    - /var/log/slurm

- name: Render the configuration from NetBox
  ansible.builtin.include_role:
    name: slurm_config

- name: Enable and start slurmctld
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: slurmctld
    enabled: true
    state: started

- name: Apply key and configuration changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for slurmctld to answer
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: scontrol ping
  register: slurm_controller_ping
  until: "'is UP' in slurm_controller_ping.stdout"
  retries: 15
  delay: 2
  changed_when: false

# The accounting and gather plugins are loaded at start. `scontrol
# reconfigure` re-executes slurmctld since 23.11, but a reconfigure lost to a
# failed run would leave the old plugins loaded with an unchanged file, so
# judge the daemon against the file rather than trust the handler, as with
# munged above.
- name: Read the rendered slurm.conf
  when: not ansible_check_mode
  become: true
  ansible.builtin.slurp:
    src: "{{ slurm_config_dir | default('/etc/slurm') }}/slurm.conf"
  register: slurm_controller_slurm_conf

- name: Read the plugins slurmctld is running
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: [scontrol, show, config]
  register: slurm_controller_running_config
  changed_when: false

- name: Restart a slurmctld running other plugins than slurm.conf names
  become: true
  when:
    - not ansible_check_mode
    - (slurm_controller_slurm_conf.content | b64decode
       | regex_search('(?m)^' ~ item ~ '=(\\S+)', '\\1') | default([''], true) | first)
      != (slurm_controller_running_config.stdout
          | regex_search('(?m)^' ~ item ~ '\\s*=\\s*(\\S+)', '\\1') | default([''], true) | first)
  ansible.builtin.systemd_service:
    name: slurmctld
    state: restarted
  loop: [AccountingStorageType, JobAcctGatherType]

- name: Wait for slurmctld to answer after the plugin check
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: scontrol ping
  register: slurm_controller_ping_after_restart
  until: "'is UP' in slurm_controller_ping_after_restart.stdout"
  retries: 15
  delay: 2
  changed_when: false
