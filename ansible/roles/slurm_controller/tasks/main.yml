---
- name: Install the Slurm controller and Munge
  become: true
  ansible.builtin.apt:
    name: "{{ slurm_controller_packages }}"
    state: present

- name: Install the cluster Munge key on the controller
  become: true
  ansible.builtin.copy:
    src: "{{ slurm_controller_munge_key_source }}"
    dest: /etc/munge/munge.key
    remote_src: true
    owner: munge
    group: munge
    mode: "0400"
  no_log: true
  notify:
    - Restart munge on the controller
    - Restart slurmctld

- name: Enable and start munge
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: munge
    enabled: true
    state: started

- name: Create the job user groups
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
    gid: "{{ item.uid }}"
  loop: "{{ cluster_job_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the job users, with the UIDs the nodes use
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    group: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
  loop: "{{ cluster_job_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create the controller state and log directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"
  loop:
    - "{{ slurm_config_state_dir | default('/var/lib/slurm/slurmctld') }}"
    - /var/log/slurm

- name: Render the configuration from NetBox
  ansible.builtin.include_role:
    name: slurm_config

- name: Enable and start slurmctld
  become: true
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: slurmctld
    enabled: true
    state: started

- name: Apply key and configuration changes now
  ansible.builtin.meta: flush_handlers

- name: Wait for slurmctld to answer
  when: not ansible_check_mode
  ansible.builtin.command:
    cmd: scontrol ping
  register: slurm_controller_ping
  until: "'is UP' in slurm_controller_ping.stdout"
  retries: 15
  delay: 2
  changed_when: false
