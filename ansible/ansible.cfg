[defaults]
inventory = inventory/
roles_path = roles
host_key_checking = False
# Lab state never goes in git, so the fact cache lives outside the repo.
# Under the user cache rather than LAB_STATE_DIR because Ansible has to be
# able to write it without sudo, including in CI where the lab state
# directory does not exist at all.
fact_caching = jsonfile
fact_caching_connection = ~/.cache/cluster-lab/fact_cache
fact_caching_timeout = 3600
stdout_callback = default
callbacks_enabled = profile_tasks, timer
# Every phase is timed and recorded, so retry files add nothing and would
# only be one more piece of lab state tempted into git.
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o PreferredAuthentications=publickey
