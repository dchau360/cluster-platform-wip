---
# Defaults shared by every play.
#
# Node count is a variable here as it is everywhere else. `N=2` and `N=4`
# must both work with no code change, so no list in this repo is ever
# written out by hand.
lab_node_count: "{{ lookup('env', 'NODE_COUNT') | default(2, true) | int }}"
lab_node_name_prefix: "{{ lookup('env', 'NODE_NAME_PREFIX') | default('cn', true) }}"
lab_node_names: >-
  {{ range(1, (lab_node_count | int) + 1)
     | map('string')
     | map('regex_replace', '^([0-9])$', '0\1')
     | map('regex_replace', '^', lab_node_name_prefix)
     | list }}

# Provisioning segment. Lab-internal, not host-specific. Derived from the
# same environment the harness reads, so a node's address is computed one
# way in shell and, from the same inputs, one way in Ansible.
lab_prov_bridge: "{{ lookup('env', 'PROV_BRIDGE') | default('br-prov', true) }}"
lab_prov_gw: "{{ lookup('env', 'PROV_GW') | default('10.42.0.1', true) }}"
lab_prov_domain: "{{ lookup('env', 'PROV_DOMAIN') | default('lab.internal', true) }}"
lab_prov_prefix: "{{ lookup('env', 'PROV_PREFIX') | default('24', true) }}"
lab_prov_network: >-
  {{ (lookup('env', 'PROV_CIDR') | default('10.42.0.0/24', true))
     | regex_replace('/.*$', '') }}
lab_prov_netmask: "{{ lookup('env', 'PROV_NETMASK') | default('255.255.255.0', true) }}"
lab_node_ip_offset: "{{ lookup('env', 'PROV_NODE_IP_OFFSET') | default('10', true) }}"

# NetBox as seen from a node on the provisioning segment.
#
# The control host reaches the API on 127.0.0.1:8000 and the seeder keeps
# using that. A node cannot: it needs the API on the segment gateway.
# sushy-emulator already owns <lab_prov_gw>:8000 (Redfish), so NetBox gets its
# own port on the same address.
#
# The API is NOT published there by Docker. A published port is DNATed to the
# container, which makes the packet a forwarded one, and the cluster_lab
# forward chain drops br-prov -> docker0 by design. The netbox role installs
# lab-netbox-api.socket, a host-local systemd socket proxy bound to the gateway
# that forwards to 127.0.0.1:8000. Nothing is forwarded, so the isolation
# property is preserved. See ansible/roles/netbox and docs/discovery.md.
lab_netbox_segment_port: "{{ lookup('env', 'NETBOX_SEGMENT_PORT') | default(8001, true) }}"
lab_netbox_segment_url: "http://{{ lab_prov_gw }}:{{ lab_netbox_segment_port }}"

# ---------------------------------------------------------------------------
# Node self-configuration (SRE-7). See docs/node-self-configuration.md.
#
# These are read on the head node, where lab/local.env is loaded, and reach a
# node only through what the head node renders for it: the cluster-pull
# overlay (mirror, ref, API) and the node API's facts (controller address and
# port). A node never reads them from its own environment, so the head node's
# local.env is the single place each one is set.
# ---------------------------------------------------------------------------
lab_node_api_port: "{{ lookup('env', 'NODE_API_PORT') | default(8002, true) }}"
lab_node_api_url: "http://{{ lab_prov_gw }}:{{ lab_node_api_port }}"
lab_git_mirror_url: "http://{{ lab_prov_gw }}/git/platform.git"
# The ref nodes pull. Never `main`: promotion is moving this ref, and a
# commit only reaches it after the CI check-mode run of local.yml passed.
lab_deployed_ref: "{{ lookup('env', 'DEPLOYED_REF') | default('deployed', true) }}"
lab_pull_interval: "{{ lookup('env', 'PULL_INTERVAL') | default('15min', true) }}"
lab_pull_splay: "{{ lookup('env', 'PULL_SPLAY') | default('5min', true) }}"
lab_pull_timeout: "{{ lookup('env', 'PULL_TIMEOUT') | default('20min', true) }}"
# A node whose last report is older than this is stale. Three missed timer
# runs, so one slow mirror fetch is not an alert.
lab_convergence_stale_seconds: "{{ lookup('env', 'CONVERGENCE_STALE_SECONDS') | default(3600, true) }}"
lab_node_exporter_port: "{{ lookup('env', 'NODE_EXPORTER_PORT') | default(9100, true) }}"

# Slurm. Site values only; node, topology and GRES values come from NetBox.
lab_slurm_cluster_name: "{{ lookup('env', 'SLURM_CLUSTER_NAME') | default('lab', true) }}"
lab_slurmctld_port: "{{ lookup('env', 'SLURMCTLD_PORT') | default(6817, true) }}"
lab_slurmd_port: "{{ lookup('env', 'SLURMD_PORT') | default(6818, true) }}"
lab_slurm_partition: "{{ lookup('env', 'SLURM_PARTITION') | default('compute', true) }}"
# Memory held back from Slurm on every node, for the OS. RealMemory is the
# NetBox-discovered memory minus this.
lab_slurm_mem_reserve_mib: "{{ lookup('env', 'SLURM_MEM_RESERVE_MIB') | default(256, true) }}"

# The users jobs run as. Same UID on the controller and every node, which is
# all Slurm needs; a directory service is out of scope for the lab.
cluster_job_users:
  - {name: hpc, uid: 2000}

# The account slurmctld runs as (slurm.conf SlurmUser). Every slurmd resolves
# it while parsing the configless config and exits if it cannot, so the nodes
# create it with the UID the controller's Debian package assigns.
cluster_slurm_user: {name: slurm, uid: 64030}

# Writable lab state. Never inside the repo, never in git.
lab_state_dir: "{{ lookup('env', 'LAB_STATE_DIR') | default('/var/lib/cluster-lab', true) }}"

# Secrets come from Warewulf per-node overlays at boot, never from here.
lab_secrets_source: warewulf-overlay
