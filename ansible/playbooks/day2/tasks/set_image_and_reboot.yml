---
- name: Start the reimage clock
  ansible.builtin.set_fact:
    rolling_t1: "{{ now(utc=true).timestamp() }}"
    rolling_reboot_at: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
    # scontrol prints the controller's local time, without a zone.
    rolling_reboot_local: "{{ now(utc=false).strftime('%Y-%m-%dT%H:%M:%S') }}"

- name: "Set the node's Warewulf image to {{ rolling_target_image }}"
  become: true
  ansible.builtin.command:
    argv:
      - wwctl
      - node
      - set
      - --yes
      - "{{ rolling_node }}"
      - --image
      - "{{ rolling_target_image }}"
      - --tagadd
      - "image_reference={{ rolling_target_reference }}"
  changed_when: true

- name: Rebuild the node's overlays so it reports the image it boots
  become: true
  ansible.builtin.command:
    cmd: wwctl overlay build {{ rolling_node }}
  changed_when: true

- name: Power-cycle the node over Redfish
  ansible.builtin.command:
    argv: [bash, "{{ rolling_redfish }}", power, "{{ rolling_node }}", cycle]
  changed_when: true

- name: Record the reimage
  ansible.builtin.include_tasks: record_phase.yml
  vars:
    day2_phase: rolling-reimage
    day2_phase_node: "{{ rolling_node }}"
    day2_phase_start: "{{ rolling_t1 }}"
