---
site:
  name: lab
  slug: lab
racks:
  - name: rack-a
    u_height: 42
device_role:
  name: Compute
  slug: compute
device_type:
  manufacturer: Synthetic Lab
  model: compute-node
  slug: compute-node
prefixes:
  bmc: 10.40.0.0/22
  provisioning: 10.44.0.0/22
  data: 10.48.0.0/22
pools:
  bmc: 10.40.0.20-10.40.2.254
  provisioning: 10.44.0.20-10.44.2.254
  data: 10.48.0.20-10.48.2.254

# One source for every provisioning-network consumer. Static node addresses
# grow upward from offset 19; unrecognised/discovery clients live in the last
# /24. The two sets cannot meet before the /22 itself is exhausted.
address_plan:
  provisioning_gateway_offset: 1
  node_offset: 19
  dynamic_pool: 10.44.3.20-10.44.3.250
  dynamic_lease: 10m
custom_fields:
  - {name: last_git_sha, type: text}
  - {name: image_tag, type: text}
  - {name: convergence_result, type: selection, choices: [success, failed]}
  - {name: convergence_duration_seconds, type: decimal}
  # The port GUID a node's InfiniBand interface reports. It carries the
  # option-61 reservation for a node that identifies itself by GUID rather
  # than by MAC. Written against synthetic GUID data only: this lab has no
  # InfiniBand hardware. See docs/ib-and-dhcp-option61.md.
  - {name: ib_guid, type: text, object_types: [dcim.interface]}
  # Written by the head-node node API on behalf of each node's pull run, so
  # "which nodes are on which commit" is a NetBox query. See
  # docs/node-self-configuration.md.
  - {name: last_converged_at, type: text}
  - {name: convergence_run_id, type: text}
  - {name: convergence_failed_task, type: text}
  # Burn-in: the node's raw measurements, and the gate's verdict on them.
  # The node writes the first and never the second; the gate runs on the
  # head node and is the only writer of the device status.
  - {name: burnin_results, type: json, netbox_type: json}
  - {name: burnin_reported_at, type: text}
  - {name: burnin_verdict, type: text}

# A new node is `staged` until the burn-in gate passes it. The seeder sets
# this once, at creation; after that the gate owns the status.
new_device_status: staged

# The switching fabric topology.conf is rendered from: one leaf per rack,
# each leaf uplinked to one spine, nodes cabled to the leaf in their rack.
fabric:
  spine: spine-01
  leaf_prefix: leaf-
  node_interface: provisioning
  switch_role: {name: Switch, slug: switch}
  switch_type: {model: synthetic-switch, slug: synthetic-switch}
