---
site:
  name: lab
  slug: lab
racks:
  - name: rack-a
    u_height: 42
device_role:
  name: Compute
  slug: compute
device_type:
  manufacturer: Synthetic Lab
  model: compute-node
  slug: compute-node
prefixes:
  bmc: 10.41.0.0/24
  provisioning: 10.42.0.0/24
  data: 10.43.0.0/24
pools:
  bmc: 10.41.0.20-10.41.0.250
  # Starts at the reserved-node offset from lab/local.env.example
  # (PROV_NODE_IP_OFFSET=10 -> node 1 is 10.42.0.11), so the address a node
  # holds is inside the pool that describes where node addresses come from.
  # The discovery payload registers the address it actually holds against
  # this range.
  provisioning: 10.42.0.10-10.42.0.250
  data: 10.43.0.20-10.43.0.250
custom_fields:
  - {name: last_git_sha, type: text}
  - {name: image_tag, type: text}
  - {name: convergence_result, type: selection, choices: [success, failed]}
  - {name: convergence_duration_seconds, type: decimal}
  # The port GUID a node's InfiniBand interface reports. It carries the
  # option-61 reservation for a node that identifies itself by GUID rather
  # than by MAC. Written against synthetic GUID data only: this lab has no
  # InfiniBand hardware. See docs/ib-and-dhcp-option61.md.
  - {name: ib_guid, type: text, object_types: [dcim.interface]}
