---
# CI for a PUBLIC repository.
#
# The first bad commit is the expensive one, so these gates were turned on
# before any content existed. Two of the five jobs exist only to stop a
# leak: `secrets` and `host-values`. The rest keep the skeleton honest.
#
# GitHub secret-scanning push protection is enabled on the repository as
# well, so a credential is refused at `git push` and never reaches a run.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  # The node image local.yml is tested in: the image nodes boot, with the
  # ansible-core nodes run. Pinned, so a test result names the image it ran
  # against; bump it in the same change that deploys a new tag.
  COMPUTE_IMAGE: ghcr.io/dchau360/cluster-images-wip/compute-slurm:sha-54a0b45db3a1

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      # Full history: a secret removed from the tip is still a leak.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # First, because it needs no tool: a tracked file named or placed like
      # key material is a finding even when it is empty, and an empty file
      # passes every content scan.
      - name: No secret material and no lab state is tracked
        run: ./scripts/check-no-tracked-secrets.sh

      # The tracked-tip check above sees the current tree only. A key added
      # and removed still lives in the pack file, so scan every ref and the
      # reflog for a path shaped like identity material.
      - name: No identity material in any git object
        run: ./scripts/check-no-identity-in-git.sh

      - name: Install gitleaks ${{ env.GITLEAKS_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner --verbose --exit-code 1

      - name: Scan the full git history
        run: gitleaks git . --redact --no-banner --verbose --exit-code 1

  host-values:
    name: host-value hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The exact-match check needs the real lab/local.env. It is supplied
      # as a repository secret so CI can search for its values without them
      # ever being in a tracked file. Fork pull requests get no secret; the
      # pattern checks in the script still run and still fail on a leaked
      # address or a real MAC.
      - name: Materialise lab/local.env from the repository secret
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          LAB_LOCAL_ENV: ${{ secrets.LAB_LOCAL_ENV }}
        run: |
          set -euo pipefail
          if [ -n "${LAB_LOCAL_ENV:-}" ]; then
            # Never echoed. The checker prints variable names only.
            printf '%s' "$LAB_LOCAL_ENV" > lab/local.env
            echo "lab/local.env written, $(wc -l < lab/local.env) line(s)"
          else
            echo "LAB_LOCAL_ENV secret not set; pattern checks only"
          fi

      - name: No host-specific value in any tracked file
        run: ./scripts/check-no-host-values.sh

      - name: Confirm lab/local.env stayed untracked
        if: always()
        run: |
          set -euo pipefail
          if ! git diff --quiet --exit-code -- . || [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::the workflow modified a tracked file"
            git status --porcelain --untracked-files=no
            exit 1
          fi
          echo "no tracked file was modified"

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: pipx install yamllint
      - run: yamllint --strict .

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check "ansible-core>=2.18" ansible-lint
      # The play uses collections (netbox.netbox). Without them installed,
      # ansible-lint fails on the module name and the playbook syntax check
      # cannot even parse the roles that use them.
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible/collections/requirements.yml
      - run: ansible-lint --offline
        working-directory: .
      - name: Playbook syntax check
        run: ansible-playbook --syntax-check site.yml
        working-directory: ansible

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lint every tracked shell script
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.sh')
          printf 'checking %d script(s)\n' "${#files[@]}"
          shellcheck -x -S style -P SCRIPTDIR "${files[@]}"

  harness:
    name: harness smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: make help
        run: make help
      - name: Every script parses
        run: |
          set -euo pipefail
          git ls-files '*.sh' | while read -r f; do bash -n "$f"; echo "ok $f"; done
      - name: Node count is a variable, never a constant
        run: ./scripts/check-node-count-is-variable.sh

  python-tests:
    name: python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Pure-function tests: the InfiniBand GUID conversion is exercised
      # against synthetic sysfs fixtures and GUIDs, because the lab has no
      # IB hardware. No third-party dependency, so nothing to install.
      - run: python3 -m unittest discover -s netbox -p 'test_*.py' -v

  node-roles:
    name: node roles and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Node-local roles use no delegate_to and read no other host's hostvars:
      # the constraint that lets one role set serve ansible-pull and push.
      - name: Node-local roles stay node-local
        run: ./scripts/check-node-roles-are-local.sh
      - name: Unit tests (seeding, renderers, node API, burn-in gate)
        run: make test-python

  # The gate between `main` and `deployed`. local.yml runs in --check inside
  # the node image, under systemd, with the node's own ansible-core, exactly
  # as ansible-pull would run it. A commit that would break pull fails here,
  # and scripts/promote.sh and the `deployed` branch protection both require
  # this job to be green before the ref can move.
  pull-check:
    name: pull check-mode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Boot a node-image container under systemd
        run: |
          set -euo pipefail
          docker run -d --name node --hostname cn01 --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw --tmpfs /run --tmpfs /tmp \
            -v "$PWD:/src:ro" "$COMPUTE_IMAGE" /usr/sbin/init
          timeout 120 bash -c 'until docker exec node systemctl is-system-running --wait 2>/dev/null \
            | grep -qE "^(running|degraded)$"; do sleep 1; done'
          echo "systemd is up in the node container"
      - name: Supply what Warewulf and the head node would have
        run: docker exec node /src/ansible/tests/prepare-node-container.sh
      - name: local.yml --check, as the node would run it
        run: docker exec node /src/ansible/tests/run-local-play.sh --check --diff

  molecule:
    name: molecule
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install --disable-pip-version-check "ansible-core>=2.18" molecule "molecule-plugins[docker]" docker
      - run: ansible-galaxy collection install community.docker ansible.posix
      - name: local.yml converges, then converges again with changed=0
        run: molecule test -s node_pull
