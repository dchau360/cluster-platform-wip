---
# The slurm_accounting role on the head node's distribution, under systemd:
# MariaDB, slurmdbd, the unit ordering, and the sacctmgr associations.
# Molecule's idempotence step requires the second converge to report
# changed=0.
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: head
    hostname: head
    image: ubuntu:26.04
    dockerfile: Dockerfile.j2
    pre_build_image: false
    privileged: true
    cgroupns_mode: host
    command: /usr/sbin/init
    tmpfs: ["/run", "/tmp"]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/ansible/roles"
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    verify: verify.yml
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
